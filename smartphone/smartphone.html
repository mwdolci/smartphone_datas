<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marco Dolci, Christophe Debons, Ayman Akram, Alexandre Mengotti">
    <title>SmartCoskpitSensor</title>
    <style>
        body {
            font-family: sans-serif;
            background: radial-gradient(circle at top left, rgba(95, 108, 124, 0.7), rgba(0, 0, 0, 0.8) 40%);
            color: white;
            margin: 0;
            padding: 0;
        }

        * {
            box-sizing: border-box;
        }

        h1 {
            margin: 22px 0 0 15px;
            font-size: 20px;
            text-align: center;
        }

        main {
            
            margin: 80px 10px 30px 10px;
            width: calc(100% - 20px);
            align-content: center;
            text-align: center ;
        }

        .entete {
            position: fixed;
            display: flex;
            top: 0;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .bannier {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            background-color:transparent;
            background-color: rgba(0, 0, 0, 0.2); /* noir semi-transparent pour assombrir */
            backdrop-filter: blur(30px);  /*flou */
        }

        pre {
            background: #f0f0f0;
            color: #333;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            width: calc(100% - 50px);
            margin-bottom: 30px;
            text-align: left ;
            margin-left: auto;
            margin-right: auto;
        }

        video {
            display: block;
            width: calc(100% - 50px);
            margin-top: 10px; 
            margin-bottom: 30px;
            background: #f0f0f0;
            border-radius: 5px;
            z-index: -1;
            margin-left: auto;
            margin-right: auto;
        }

        .sensor {
            margin-bottom: 20px;
        }

        button {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            text-decoration: none;
            width: calc(100% - 50px);
        }

        /* * {
        outline: 1px solid rgba(157, 255, 0, 0.2); 
        } */
    </style>
</head>

<header class="entete">
	<div class="bannier"> <h1>Smart Cockpit Sensor</h1></div>
</header>

<body>
    <main>
        <!-- <button onclick="startAll()">Démarrer tout</button> -->

        <button onclick="startGPS()">GPS</button>
        <pre id="gpsOutput">En attente...</pre>

        <button onclick="startOrientation()">Orientation</button>
        <pre id="orientationOutput">En attente...</pre>

        <button onclick="startBattery()">Batterie</button>
        <pre id="batteryOutput">En attente...</pre>

        <button onclick="startMicro()">Micro</button>
        <pre id="microOutput">En attente...</pre>

        <button onclick="startCamera()">Caméra</button>
        <video id="cameraVideo" width="180" height="auto" autoplay></video>

        <button onclick="startTime()">Heure</button>
        <pre id="timeOutput">En attente...</pre>

        <button onclick="startNetwork()">Réseau</button>
        <pre id="networkOutput">En attente...</pre>

        <button onclick="startAccelerometer()">Accéléromètre</button>
        <pre id="accelOutput">En attente...</pre>

        <pre id="logOutput">Logs WebSocket et capteurs :</pre>
    </main>

    <script>
        const ws = new WebSocket("wss://smartphone-datas.onrender.com"); // instancie la connexion WebSocket

        // Fonction pour afficher les logs dans la page
        function log(msg) {
            const pre = document.getElementById('logOutput');
            pre.textContent += msg + "\n";
        }

        // Fonction pour envoyer les données via WebSocket
        function sendSensor(name, data) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ capteur: name, data }));
                log("Envoyé : " + name);
            } else {
                log("WebSocket pas encore ouverte, réessai pour " + name);
                setTimeout(() => sendSensor(name, data), 500);
            }
        }

        // WebSocket événements
        ws.onopen = () => {
            log("WebSocket ouverte !");
            // test simple : message toutes les 2 secondes
            setInterval(() => sendSensor("test", { msg: "Hello cockpit !" }), 2000);
        };

        // vérifier si webrtc message arrive (answer ou ice)
        ws.addEventListener("message", event => {
            log("Reçu du serveur : " + event.data);

            let msg;
            try {
                msg = JSON.parse(event.data); // essaye de parser en JSON (envent.data = le message reçu)
            } catch {
                return; // message non json -> message normal
            }

            // Answer du cockpit -> répond à offer
            if (msg.type === "answer") {
                if (!peerConnection) {
                    log("Answer reçue mais peerConnection pas encore créé.");
                    return;
                }
                peerConnection.setRemoteDescription(msg.answer); // configure la connexion WebRTC avec le cockpit en envoyant l'answer
            }

            // "ICE" est le terme technique pour établir une connexion WebRTC
            if (msg.type === "ice") {
                if (!peerConnection) {
                    log("ICE reçu mais peerConnection pas encore créé.");
                    return;
                }
                peerConnection.addIceCandidate(msg.candidate); // ajoute un candidat ICE pour établir la connexion WebRTC
            }
        });
        ws.onerror = e => log("Erreur WebSocket : " + e); // gère les erreurs de la connexion WebSocket
        ws.onclose = e => log("WebSocket fermée."); // gère la fermeture de la connexion WebSocket

        // --- WebRTC ---
        let peerConnection;
        let videoStream;

        function startWebRTC() {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(stream => { // obtient le flux vidéo de la caméra

                document.getElementById("cameraVideo").srcObject = stream; // affiche le flux vidéo dans l'élément video

                peerConnection = new RTCPeerConnection(); // crée une nouvelle connexion WebRTC

                // Ajout des pistes
                stream.getTracks().forEach(track => { 
                    peerConnection.addTrack(track, stream); // ajoute chaque piste (vidéo/audio) à la connexion WebRTC (.addTrack permet d'ajouter une piste individuelle)
                });

                // ICE
                peerConnection.onicecandidate = event => { // écoute les candidats ICE pour établir la connexion WebRTC
                    if (event.candidate) {
                        ws.send(JSON.stringify({ type: "ice", candidate: event.candidate })); // envoie le candidat ICE au serveur via WebSocket
                    }
                };

                peerConnection.createOffer().then(offer => {            // crée une offre pour démarrer la connexion WebRTC
                    peerConnection.setLocalDescription(offer);          // configure la connexion WebRTC avec l'offre créée
                    ws.send(JSON.stringify({ type: "offer", offer }));  // envoie l'offre au serveur via WebSocket
                });
            });
        }

        // -------- Capteurs --------
        function startGPS() {
            navigator.geolocation.watchPosition( // navigatore.geolocation.getCurrentPosition est un objet pour obtenir la position GPS
                position => {
                    const data = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        timestamp: position.timestamp
                    };
                    document.getElementById('gpsOutput').textContent = JSON.stringify(data, null, 2); // JSON.stringify pour formater l'objet en JSON lisible (data= l'objet, null=pas de filtre, 2=indentation)
                    sendSensor("gps", data);
                },
                error => console.error("Erreur GPS :", error)
            );
        }

        function startAccelerometer() {
            window.addEventListener('devicemotion', event => { // écoute les événements de mouvement de l'appareil -- devicemotion pour l'accéléromètre
                const data = {
                    accelerationIncludingGravity: event.accelerationIncludingGravity,
                    interval: event.interval
                };
                document.getElementById('accelOutput').textContent = JSON.stringify(data, null, 2); // JSON.stringify pour formater l'objet en JSON lisible (data= l'objet, null=pas de filtre, 2=indentation)
                sendSensor("accelerometre", data);
            });
        }

        function startOrientation() {
            window.addEventListener('deviceorientation', event => { // écoute les événements d'orientation de l'appareil -- deviceorientation pour l'orientation
                // Arrondit les valeurs à 2 décimales pour réduire le flux de données
                const alpha = Math.round(event.alpha * 100) / 100;
                const beta  = Math.round(event.beta  * 100) / 100;
                const gamma = Math.round(event.gamma * 100) / 100;

                const data = {
                    absolute: event.absolute,
                    alpha,
                    beta,
                    gamma
                };
                document.getElementById('orientationOutput').textContent = JSON.stringify(data, null, 2); // JSON.stringify pour formater l'objet en JSON lisible (data= l'objet, null=pas de filtre, 2=indentation)
                sendSensor("orientation", data);
            });
        }

        function startBattery() {
            if (!navigator.getBattery) { alert("API batterie non supportée"); return; } // vérifie si l'API batterie est supportée
            navigator.getBattery().then(battery => { // obtient l'objet batterie .then permet d'attendre le résultat
                function updateBattery() {
                    const data = {
                        level: battery.level * 100 + '%',
                        charging: battery.charging,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                    document.getElementById('batteryOutput').textContent = JSON.stringify(data, null, 2); // JSON.stringify pour formater l'objet en JSON lisible (data= l'objet, null=pas de filtre, 2=indentation)
                    sendSensor("battery", data);
                }
                battery.addEventListener('levelchange', updateBattery); // écoute les changements de niveau de batterie
                battery.addEventListener('chargingchange', updateBattery); // écoute les changements d'état de charge (branché/débranché)
                updateBattery();
            });
        }

        function startMicro() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert("Microphone non supporté"); return; } // vérifie si l'API micro est supportée
            navigator.mediaDevices.getUserMedia({ audio: true }) // obtient le flux audio du micro
                .then(stream => {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();  // crée objet d'un contexte audio
                    const source = audioContext.createMediaStreamSource(stream);                    // crée une source audio à partir du flux du micro
                    const analyser = audioContext.createAnalyser();                                 // crée un analyseur audio
                    source.connect(analyser);                                                       // connecte la source audio à l'analyseur
                    analyser.fftSize = 256;                                                         // taille de la FFT pour l'analyse du son (FFT = Fast Fourier Transform)
                    const dataArray = new Uint8Array(analyser.frequencyBinCount);                   // tableau pour stocker les données audio

                    // Fonction pour analyser le volume sonore
                    function updateMicro() {
                        analyser.getByteTimeDomainData(dataArray); // remplit dataArray avec les données audio actuelles
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) sum += Math.abs(dataArray[i] - 128); // calcule la somme des amplitudes (centrées autour de 128 qui est le niveau moyen)
                        const volume = sum / dataArray.length;
                        const data = { volume };
                        document.getElementById('microOutput').textContent = "Volume : " + volume.toFixed(2); // affiche le volume arrondi à 2 décimales
                        sendSensor("micro", data);
                        requestAnimationFrame(updateMicro); // appelle updateMicro à chaque frame pour une mise à jour continue
                    }
                    updateMicro();
                })
                .catch(err => document.getElementById('microOutput').textContent = "Erreur micro : " + err.message); // gère les erreurs d'accès au micro
        }

        function startCamera() {
            startWebRTC(); // démarre la connexion WebRTC pour la caméra
        }

        function startTime() {
            function updateTime() {
                const now = new Date();
                const data = { localeTime: now.toLocaleTimeString(), fullDate: now.toLocaleString() }; // crée un objet avec l'heure locale et la date complète
                document.getElementById('timeOutput').textContent = JSON.stringify(data, null, 2); // JSON.stringify pour formater l'objet en JSON lisible (data= l'objet, null=pas de filtre, 2=indentation)
                sendSensor("time", data);
            }
            updateTime(); 
            setInterval(updateTime, 1000); // met à jour l'heure toutes les secondes
        }

        function startNetwork() {
            if (!navigator.connection) { alert("API réseau non supportée"); return; } // vérifie si l'API réseau est supportée
            function updateNetwork() {
                const conn = navigator.connection; // obtient l'objet de connexion réseau
                const data = {
                    effectiveType: conn.effectiveType,
                    downlink: conn.downlink + " Mbps",      // vitesse de téléchargement en Mbps
                    rtt: conn.rtt + " ms",                  // rtt = round-trip time en ms -> permet de mesurer la latence
                    saveData: conn.saveData                 // indique si le mode économie de données est activé
                };
                document.getElementById('networkOutput').textContent = JSON.stringify(data, null, 2); // JSON.stringify pour formater l'objet en JSON lisible (data= l'objet, null=pas de filtre, 2=indentation)
                sendSensor("network", data);
            }
            navigator.connection.addEventListener('change', updateNetwork); // écoute les changements dans la connexion réseau
            updateNetwork();
        }

        // Démarrer tous les capteurs (à éviter si pas besoin de tout car ralentit le thread)
        function startAll() {
            startGPS();
            startAccelerometer();
            startOrientation();
            startBattery();
            startMicro();
            startCamera();
            startTime();
            startNetwork();
        }

    </script>
</body>

</html>
